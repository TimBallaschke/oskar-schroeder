<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oskar Schoreder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- <div class="webpage-title">Oskar Schroeder</div> -->
    <div class="" id="content-container">
    </div>
    <div id="version-history-container">
        <div id="version-history">
            <div class="version-history-element" id="version-history-element-1">
                <div class="version-history-element-number">
                    <div class="version-history-element-digits">01</div>
                </div>
                <div class="version-history-element-title">Starting Page</div>
            </div>
        </div>
    </div>
    <div class="bottom-navigation">
        <div class="input-bar-container">
            <div class="input-bar">
                <div id="prompt-proposals">
                    <div id="prompt-proposal-1"></div>
                    <div id="prompt-proposal-2"></div>
                    <div id="prompt-proposal-3"></div>
                    <div id="prompt-proposal-4"></div>
                </div>
                <div class="input-bar-elements">
                    <input type="text" class="message-input" id="user-input" placeholder="Ask about Oskar Schroeder ...">
                    <div class="button-container">
                        <button class="send-button" onclick="sendMessage()"></button>
                    </div>
                </div>
            </div> 
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
