<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oskar Schoreder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- <div class="webpage-title">Oskar Schroeder</div> -->
    <div class="" id="content-container">
    </div>
    <div id="version-history-container">
        <div id="version-history">
            <div class="version-history-element" id="version-history-element-1" version-history-key="0">
                <div class="version-history-element-number">
                    <div class="version-history-element-digits">01</div>
                </div>
                <div class="version-history-element-title">Starting Page</div>
            </div>
        </div>
    </div>
    <div id="bottom-navigation-container">
        <div id="bottom-navigation">
            <div id="bottom-navigation-elements">
                <div id="prompt-proposals">
                    <div class="prompt-proposal-container">
                        <div class="prompt-proposal navigation-type" id="prompt-proposal-1">Prompt Proposal 1</div>
                    </div>
                    <div class="prompt-proposal-container">
                        <div class="prompt-proposal navigation-type" id="prompt-proposal-2">Prompt Proposal 2</div>
                    </div>
                    <div class="prompt-proposal-container">
                        <div class="prompt-proposal navigation-type" id="prompt-proposal-3">Prompt Proposal 3</div>
                    </div>
                    <div class="prompt-proposal-container">
                        <div class="prompt-proposal navigation-type" id="prompt-proposal-4">Prompt Proposal 4</div>
                    </div>
                </div>
                <div id="input-bar">
                    <div id="user-input-container">
                        <input type="text" id="user-input" placeholder="Ask about Oskar Schroeder ...">
                    </div>
                </div>
                <div id="buttons-container">
                    <div class="button" id="send-button">
                        <div id="arrow-top"></div>
                        <div id="arrow-bottom"></div>
                    </div>
                    <div class="button" id="plus-minus-button">
                        <div id="plus-minus-horizontal"></div>
                        <div id="plus-minus-vertical"></div>
                    </div>
                </div>
            </div> 
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
